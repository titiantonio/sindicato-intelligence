services:

  postgres:
    image: postgres:17
    container_name: sindicato-postgres

    environment:
      POSTGRES_DB: sindicato_intelligence
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  n8n:
    image: n8nio/n8n:latest
    container_name: sindicato-n8n-dev

    ports:
      - "5678:5678"

    environment:
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      N8N_BASIC_AUTH_ACTIVE: ${N8N_BASIC_AUTH_ACTIVE:-true}
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:?N8N_BASIC_AUTH_USER is required}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:?N8N_BASIC_AUTH_PASSWORD is required}
      GENERIC_TIMEZONE: Europe/Madrid
      N8N_BLOCK_ENV_ACCESS_IN_NODE: ${N8N_BLOCK_ENV_ACCESS_IN_NODE:-false}
      BACKEND_BASE_URL: ${BACKEND_BASE_URL:-http://host.docker.internal:8080}
      BACKEND_N8N_AUTH_EMAIL: ${BACKEND_N8N_AUTH_EMAIL:?BACKEND_N8N_AUTH_EMAIL is required}
      BACKEND_N8N_AUTH_PASSWORD: ${BACKEND_N8N_AUTH_PASSWORD:?BACKEND_N8N_AUTH_PASSWORD is required}

    volumes:
      - n8n_data:/home/node/.n8n

  mailhog:
    image: mailhog/mailhog:latest
    container_name: sindicato-mailhog

    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
  n8n_data:
