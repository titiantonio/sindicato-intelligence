<div class="shell" [class.shell--collapsed]="sidebarCollapsed()">
  <aside
    class="shell__sidebar"
    [class.shell__sidebar--open]="sidebarOpen()"
    [class.shell__sidebar--collapsed]="sidebarCollapsed()"
  >
    <div class="shell__brand-row">
      <div class="shell__brand">
        <span class="shell__eyebrow">Sindicato Intelligence</span>
        <strong>Backoffice editorial</strong>
      </div>
      <button
        type="button"
        class="shell__collapse-button"
        [attr.aria-label]="sidebarCollapsed() ? 'Expandir menu lateral' : 'Ocultar menu lateral'"
        [title]="sidebarCollapsed() ? 'Expandir menu lateral' : 'Ocultar menu lateral'"
        (click)="toggleSidebarCollapsed()"
      >
        <span aria-hidden="true">{{ sidebarCollapsed() ? '>' : '<' }}</span>
      </button>
    </div>

    <nav class="shell__nav">
      @for (item of navigationItems(); track item.route) {
        <a
          [routerLink]="item.route"
          routerLinkActive="shell__nav-link--active"
          class="shell__nav-link"
          (click)="closeSidebar()"
          [title]="sidebarCollapsed() ? item.label : null"
        >
          <span class="shell__nav-icon" aria-hidden="true">{{ item.icon }}</span>
          <span class="shell__nav-text">{{ item.label }}</span>
        </a>
      }
    </nav>
  </aside>

  <div class="shell__content">
    <header class="shell__header">
      <button type="button" class="shell__menu-button" (click)="toggleSidebar()">
        Menu
      </button>

      <div class="shell__header-copy">
        <span class="shell__header-title">Plataforma interna de inteligencia informativa</span>
        <span class="shell__header-subtitle">Seguimiento educativo andaluz con foco sindical</span>
      </div>

      <button
        type="button"
        class="shell__theme-button"
        [class.shell__theme-button--dark]="themeService.theme() === 'dark'"
        [attr.aria-pressed]="themeService.theme() === 'dark'"
        [attr.aria-label]="themeService.theme() === 'dark' ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
        [title]="themeService.theme() === 'dark' ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
        (click)="toggleTheme()"
      >
        <span aria-hidden="true">{{ themeService.theme() === 'dark' ? '☀' : '☾' }}</span>
      </button>

      @if (currentUser(); as user) {
        <div class="shell__user">
          <div>
            <strong>{{ user.name }}</strong>
            <span>{{ user.role }}</span>
          </div>
          <button type="button" class="shell__logout-button" (click)="logout()">
            Salir
          </button>
        </div>
      }
    </header>

    <main class="shell__main">
      <router-outlet />
    </main>
  </div>
</div>
