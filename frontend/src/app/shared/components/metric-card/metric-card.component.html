<article class="metric-card" [class]="'metric-card metric-card--' + card().tone">
  <header class="metric-card__header">
    <span class="metric-card__main-icon" aria-hidden="true">
      <i [class]="iconClass(card().icon)"></i>
    </span>
    <div class="metric-card__title">
      <h2>{{ card().title }}</h2>
      <p>{{ card().subtitle }}</p>
    </div>
    <span class="metric-card__badge">{{ card().badgeLabel }}</span>
  </header>

  <div class="metric-card__body">
    @for (item of card().items; track item.label) {
      <section class="metric-card__item">
        <span class="metric-card__item-label">{{ item.label }}</span>
        <div class="metric-card__item-value" [class]="'metric-card__item-value metric-card__item-value--' + valueTone(item)">
          <i [class]="iconClass(item.icon)" aria-hidden="true"></i>
          <strong>{{ formattedValue(item) }}</strong>
        </div>
      </section>
    }
  </div>

  <footer class="metric-card__footer">
    <i class="pi pi-clock" aria-hidden="true"></i>
    <span>Ultima actualizacion: {{ formattedLastUpdatedAt() }}</span>
  </footer>
</article>
