<section class="auth-side-page">
  <article class="auth-side-page__card">
    <h1>Recuperar password</h1>
    <p>
      Introduce tu email corporativo y te enviaremos un enlace para establecer una nueva password.
    </p>

    <form [formGroup]="forgotPasswordForm" (ngSubmit)="submit()" class="auth-side-page__form">
      <label class="auth-side-page__field">
        <span>Email</span>
        <input type="email" formControlName="email" placeholder="admin@sindicato.es" />
      </label>

      @if (errorMessage(); as error) {
        <p class="auth-side-page__error">{{ error }}</p>
      }

      @if (successMessage(); as message) {
        <p class="auth-side-page__success">{{ message }}</p>
      }

      <button type="submit" [disabled]="isSubmitting()">
        {{ isSubmitting() ? 'Enviando...' : 'Enviar enlace de recuperacion' }}
      </button>

      <button type="button" class="auth-side-page__secondary" [disabled]="isSubmitting()" (click)="requestTemporaryPassword()">
        Solicitar nueva password temporal
      </button>
    </form>

    <a routerLink="/login" class="auth-side-page__back-link">Volver al login</a>
  </article>
</section>
