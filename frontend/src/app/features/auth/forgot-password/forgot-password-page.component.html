<main class="auth-side-page">
  <article class="auth-side-page__card">
    <h1>Recuperar password</h1>
    <p>
      Introduce tu email corporativo y te enviaremos un enlace para establecer una nueva password.
    </p>

    <form [formGroup]="forgotPasswordForm" (ngSubmit)="submit()" class="auth-side-page__form">
      <label class="auth-side-page__field" for="forgot-password-email">
        <span>Email</span>
        <input id="forgot-password-email" pInputText type="email" formControlName="email" placeholder="admin@sindicato.es" />
      </label>

      @if (errorMessage(); as error) {
        <p-message severity="error" [text]="error" />
      }

      @if (successMessage(); as message) {
        <p-message severity="success" [text]="message" />
      }

      <button
        pButton
        type="submit"
        icon="pi pi-envelope"
        [label]="isSubmitting() ? 'Enviando...' : 'Enviar enlace de recuperacion'"
        [loading]="isSubmitting()"
        [disabled]="isSubmitting()"
      ></button>
    </form>

    <a routerLink="/login" class="auth-side-page__back-link">Volver al login</a>
  </article>
</main>
