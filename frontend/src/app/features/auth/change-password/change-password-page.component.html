<section class="auth-side-page">
  <article class="auth-side-page__card">
    <h1>Cambiar password</h1>
    <p>
      Establece una password definitiva. Debe tener al menos 10 caracteres, mayuscula,
      minuscula, numero y simbolo.
    </p>

    <form [formGroup]="changePasswordForm" (ngSubmit)="submit()" class="auth-side-page__form">
      <label class="auth-side-page__field">
        <span>Password temporal</span>
        <input type="password" formControlName="currentPassword" />
      </label>

      <label class="auth-side-page__field">
        <span>Nueva password</span>
        <input type="password" formControlName="newPassword" />
      </label>

      <label class="auth-side-page__field">
        <span>Confirmar password</span>
        <input type="password" formControlName="confirmPassword" />
      </label>

      @if (errorMessage(); as error) {
        <p class="auth-side-page__error">{{ error }}</p>
      }

      @if (successMessage(); as message) {
        <p class="auth-side-page__success">{{ message }}</p>
      }

      <button type="submit" [disabled]="isSubmitting() || successMessage() !== null">
        {{ isSubmitting() ? 'Guardando...' : 'Cambiar password' }}
      </button>
    </form>
  </article>
</section>
