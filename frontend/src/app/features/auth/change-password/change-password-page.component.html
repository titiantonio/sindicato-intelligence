<main class="auth-side-page">
  <app-theme-toggle class="auth-theme-toggle" />
  <article class="auth-side-page__card">
    <span class="auth-side-page__eyebrow"><i class="pi pi-shield" aria-hidden="true"></i> Acceso seguro</span>
    <h1>Cambiar password</h1>
    <p>
      Establece una password definitiva. Debe tener al menos 10 caracteres, mayuscula,
      minuscula, numero y simbolo.
    </p>

    <form [formGroup]="changePasswordForm" (ngSubmit)="submit()" class="auth-side-page__form">
      <label class="auth-side-page__field" for="change-password-current-password">
        <span>Password temporal</span>
        <input id="change-password-current-password" pInputText type="password" formControlName="currentPassword" />
      </label>

      <label class="auth-side-page__field" for="change-password-new-password">
        <span>Nueva password</span>
        <input id="change-password-new-password" pInputText type="password" formControlName="newPassword" />
      </label>

      <label class="auth-side-page__field" for="change-password-confirm-password">
        <span>Confirmar password</span>
        <input id="change-password-confirm-password" pInputText type="password" formControlName="confirmPassword" />
      </label>

      @if (errorMessage(); as error) {
        <p-message severity="error" [text]="error" />
      }

      @if (successMessage(); as message) {
        <p-message severity="success" [text]="message" />
      }

      <button
        pButton
        type="submit"
        icon="pi pi-lock"
        [label]="isSubmitting() ? 'Guardando...' : 'Cambiar password'"
        [loading]="isSubmitting()"
        [disabled]="isSubmitting() || successMessage() !== null"
      ></button>
    </form>
  </article>
</main>
