<section class="auth-side-page">
  <article class="auth-side-page__card">
    <h1>Establecer nueva password</h1>
    <p>
      Introduce una nueva password segura. Debe tener al menos 10 caracteres, mayuscula,
      minuscula, numero y simbolo.
    </p>

    <form [formGroup]="resetPasswordForm" (ngSubmit)="submit()" class="auth-side-page__form">
      <label class="auth-side-page__field">
        <span>Token de recuperacion</span>
        <input type="text" formControlName="token" placeholder="Pega el token o usa el enlace del correo" />
      </label>

      <label class="auth-side-page__field">
        <span>Nueva password</span>
        <input type="password" formControlName="newPassword" />
      </label>

      <label class="auth-side-page__field">
        <span>Confirmar password</span>
        <input type="password" formControlName="confirmPassword" />
      </label>

      @if (errorMessage(); as error) {
        <p class="auth-side-page__error">{{ error }}</p>
      }

      @if (successMessage(); as message) {
        <p class="auth-side-page__success">{{ message }}</p>
      }

      <button type="submit" [disabled]="isSubmitting()">
        {{ isSubmitting() ? 'Actualizando...' : 'Actualizar password' }}
      </button>
    </form>

    <a routerLink="/login" class="auth-side-page__back-link">Volver al login</a>
  </article>
</section>
