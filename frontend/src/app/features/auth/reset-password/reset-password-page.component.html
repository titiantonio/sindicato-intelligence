<main class="auth-side-page">
  <app-theme-toggle class="auth-theme-toggle" />
  <article class="auth-side-page__card">
    <span class="auth-side-page__eyebrow"><i class="pi pi-shield" aria-hidden="true"></i> Acceso seguro</span>
    <h1>Establecer nueva password</h1>
    <p>
      Introduce una nueva password segura. Debe tener al menos 10 caracteres, mayuscula,
      minuscula, numero y simbolo.
    </p>

    <form [formGroup]="resetPasswordForm" (ngSubmit)="submit()" class="auth-side-page__form">
      <label class="auth-side-page__field" for="reset-password-new-password">
        <span>Nueva password</span>
        <input id="reset-password-new-password" pInputText type="password" formControlName="newPassword" />
      </label>

      <label class="auth-side-page__field" for="reset-password-confirm-password">
        <span>Confirmar password</span>
        <input id="reset-password-confirm-password" pInputText type="password" formControlName="confirmPassword" />
      </label>

      @if (errorMessage(); as error) {
        <p-message severity="error" [text]="error" />
      }

      @if (successMessage(); as message) {
        <p-message severity="success" [text]="message" />
      }

      <button
        pButton
        type="submit"
        icon="pi pi-key"
        [label]="isSubmitting() ? 'Actualizando...' : 'Actualizar password'"
        [loading]="isSubmitting()"
        [disabled]="isSubmitting()"
      ></button>
    </form>

    <a routerLink="/login" class="auth-side-page__back-link">Volver al login</a>
  </article>
</main>
