spring:

  output:
    ansi:
      enabled: ${SPRING_OUTPUT_ANSI_ENABLED:always}

  datasource:
    url: jdbc:postgresql://localhost:5432/sindicato_intelligence
    username: sindicato
    password: sindicato123

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

server:
  port: 8080

app:
  security:
    jwt:
      secret: ${JWT_SECRET:change-this-jwt-secret-in-production-min-32-bytes}
      issuer: ${JWT_ISSUER:sindicato-intelligence}
      access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:15}
      refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS:7}

  content:
    default-created-by: ${CONTENT_DEFAULT_CREATED_BY:1}

  ai:
    provider: ${AI_PROVIDER:deterministic}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:models/gemma-4-31b-it}
      temperature: ${GEMINI_TEMPERATURE:0.2}
      max-output-tokens: ${GEMINI_MAX_OUTPUT_TOKENS:1024}

  publication:
    telegram:
      enabled: ${TELEGRAM_ENABLED:false}
      base-url: ${TELEGRAM_BASE_URL:https://api.telegram.org}
      bot-token: ${TELEGRAM_BOT_TOKEN:}
      chat-id: ${TELEGRAM_CHAT_ID:}
