spring:

  output:
    ansi:
      enabled: ${SPRING_OUTPUT_ANSI_ENABLED:always}

  datasource:
    url: jdbc:postgresql://localhost:5432/sindicato_intelligence
    username: sindicato
    password: ${DB_PASSWORD:Admin@12345}

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

  servlet:
    multipart:
      max-file-size: ${HTTP_MULTIPART_MAX_FILE_SIZE:100MB}
      max-request-size: ${HTTP_MULTIPART_MAX_REQUEST_SIZE:120MB}

server:
  port: 8080

springdoc:
  api-docs:
    enabled: ${OPENAPI_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${OPENAPI_SWAGGER_UI_ENABLED:true}

app:
  openapi:
    public-access: ${OPENAPI_PUBLIC_ACCESS:true}
    version: ${OPENAPI_VERSION:0.0.106-SNAPSHOT}

  security:
    jwt:
      secret: ${JWT_SECRET:change-this-jwt-secret-in-production-min-32-bytes}
      issuer: ${JWT_ISSUER:sindicato-intelligence}
      access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:15}
      refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS:7}
    password-reset:
      token-minutes: ${PASSWORD_RESET_TOKEN_MINUTES:30}
      reset-base-url: ${PASSWORD_RESET_BASE_URL:http://localhost:4200/reset-password}
      mail-from: ${PASSWORD_RESET_MAIL_FROM:no-reply@sindicato.local}
    temporary-password:
      expiration-days: ${TEMPORARY_PASSWORD_EXPIRATION_DAYS:7}
    settings:
      encryption-key: ${SETTINGS_ENCRYPTION_KEY:change-this-settings-encryption-key-in-production-min-32-bytes}

  content:
    default-created-by: ${CONTENT_DEFAULT_CREATED_BY:1}
    relevant-links:
      connect-timeout-ms: ${CONTENT_RELEVANT_LINKS_CONNECT_TIMEOUT_MS:2000}
      read-timeout-ms: ${CONTENT_RELEVANT_LINKS_READ_TIMEOUT_MS:3000}
      blocked-domains: ${CONTENT_RELEVANT_LINKS_BLOCKED_DOMAINS:ccoo.es,fe.ccoo.es,anpeandalucia.es,anpe.es,csif.es,ustealdia.org,ustea.es,ugt.es,fespugt.es,ugt-sp.es}
      allowed-official-domains: ${CONTENT_RELEVANT_LINKS_ALLOWED_OFFICIAL_DOMAINS:juntadeandalucia.es,boja.es,boe.es,gob.es,educacion.gob.es,educacionyfp.gob.es,universidades.gob.es}

  classification:
    url-enrichment:
      connect-timeout-ms: ${CLASSIFICATION_URL_ENRICHMENT_CONNECT_TIMEOUT_MS:2000}
      read-timeout-ms: ${CLASSIFICATION_URL_ENRICHMENT_READ_TIMEOUT_MS:3000}
      max-characters: ${CLASSIFICATION_URL_ENRICHMENT_MAX_CHARACTERS:12000}

  ai:
    provider: ${AI_PROVIDER:deterministic}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:models/gemma-4-31b-it}
      temperature: ${GEMINI_TEMPERATURE:0.2}
      max-output-tokens: ${GEMINI_MAX_OUTPUT_TOKENS:1024}

  publication:
    telegram:
      enabled: ${TELEGRAM_ENABLED:false}
      base-url: ${TELEGRAM_BASE_URL:https://api.telegram.org}
      bot-token: ${TELEGRAM_BOT_TOKEN:}
      chat-id: ${TELEGRAM_CHAT_ID:}
