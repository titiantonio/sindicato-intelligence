spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/sindicato_intelligence
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

server:
  port: 8080

app:
  security:
    temporary-password:
      expiration-days: ${TEMPORARY_PASSWORD_EXPIRATION_DAYS:7}

  ai:
    provider: ${AI_PROVIDER:deterministic}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:models/gemma-4-31b-it}
      temperature: ${GEMINI_TEMPERATURE:0.2}
      max-output-tokens: ${GEMINI_MAX_OUTPUT_TOKENS:1024}
