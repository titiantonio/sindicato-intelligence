spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/sindicato_intelligence
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

server:
  port: 8080

springdoc:
  api-docs:
    enabled: ${OPENAPI_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${OPENAPI_SWAGGER_UI_ENABLED:false}

app:
  openapi:
    public-access: ${OPENAPI_PUBLIC_ACCESS:false}
    version: ${OPENAPI_VERSION:0.0.120-SNAPSHOT}

  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER:sindicato-intelligence}
      access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:15}
      refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS:7}
    settings:
      encryption-key: ${SETTINGS_ENCRYPTION_KEY}
    temporary-password:
      expiration-days: ${TEMPORARY_PASSWORD_EXPIRATION_DAYS:7}

  ai:
    provider: ${AI_PROVIDER:deterministic}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:models/gemma-4-31b-it}
      temperature: ${GEMINI_TEMPERATURE:0.2}
      max-output-tokens: ${GEMINI_MAX_OUTPUT_TOKENS:1024}
